server {
    listen 80;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=5s ipv6=off;

    location = /ready {
        set $backend http://backend:8080;
        proxy_pass $backend/ready;
        add_header Cache-Control no-store always;
    }

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_hide_header Cache-Control;
        add_header Cache-Control no-store always;
    }

    location ~ ^/(pedidos|frota|entregas)$ { return 308 $uri/; }

    location ~ ^/(pedidos|frota|entregas)/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /pedidos/ { try_files $uri $uri/ /pedidos/index.html; }
    location /frota/ { try_files $uri $uri/ /frota/index.html; }
    location /entregas/ { try_files $uri $uri/ /entregas/index.html; }
    location ~ \.html$ { add_header Cache-Control no-cache; }
    location / { try_files $uri $uri/ =404; }
}
