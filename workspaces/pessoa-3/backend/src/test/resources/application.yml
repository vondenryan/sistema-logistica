spring:
  datasource:
    url: jdbc:h2:mem:deliveries_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    schemas: deliveries
    locations: classpath:db/migration/deliveries
    default-schema: deliveries
    create-schemas: true

logging:
  level:
    root: WARN
    logistics: DEBUG
