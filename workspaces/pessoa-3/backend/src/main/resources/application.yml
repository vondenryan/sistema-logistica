server:
  forward-headers-strategy: none
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: deliveries-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/logistics_p3}
    username: ${DB_USER:logistics}
    password: ${DB_PASSWORD:logistics}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    schemas: deliveries
    locations: classpath:db/migration/deliveries
    default-schema: deliveries
    create-schemas: true

logging:
  level:
    root: INFO
    logistics: DEBUG

tracking:
  trusted-proxy-ips: ${TRACKING_TRUSTED_PROXY_IPS:}
  rate-limit:
    max-clients: ${TRACKING_RATE_LIMIT_MAX_CLIENTS:10000}
