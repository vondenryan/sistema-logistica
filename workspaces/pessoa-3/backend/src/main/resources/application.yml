server:
  forward-headers-strategy: none
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: deliveries-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/logistics_p3}
    username: ${DB_USER:logistics}
    password: ${DB_PASSWORD:logistics}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    schemas: deliveries,notifications,documents
    locations: classpath:db/migration/deliveries,classpath:db/migration/notifications,classpath:db/migration/documents
    default-schema: deliveries
    create-schemas: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAILPIT_SMTP_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

notifications:
  smtp:
    enabled: ${NOTIFICATIONS_SMTP_ENABLED:false}
    from: ${NOTIFICATIONS_FROM:noreply@logistica-academica.invalid}
  outbox:
    max-attempts: 5
    base-retry-seconds: 5

logging:
  level:
    root: INFO
    logistics: DEBUG

tracking:
  trusted-proxy-ips: ${TRACKING_TRUSTED_PROXY_IPS:}
  rate-limit:
    max-clients: ${TRACKING_RATE_LIMIT_MAX_CLIENTS:10000}
