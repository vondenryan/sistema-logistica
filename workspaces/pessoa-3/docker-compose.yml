services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-pessoa-3
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-logistics_p3}
      POSTGRES_USER: ${POSTGRES_USER:-logistics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logistics}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - p3-postgres-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit-pessoa-3
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  p3-postgres-data:
