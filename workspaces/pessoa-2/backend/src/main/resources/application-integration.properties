server.port=${PORT:8080}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.data-source-properties.currentSchema=pessoa2,public
spring.jpa.properties.hibernate.default_schema=pessoa2
spring.flyway.default-schema=public
spring.flyway.validate-migration-naming=true
spring.flyway.locations=classpath:core/db/migration/identity,classpath:core/db/migration/orders,classpath:core/db/migration/billing,classpath:core/db/migration/routing
app.jwt-secret=${JWT_SECRET}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
notifications.smtp.enabled=true
notifications.outbox.scheduler-enabled=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
server.forward-headers-strategy=none
app.security.login-trusted-proxy-ips=${GATEWAY_TRUSTED_IP:}
tracking.trusted-proxy-ips=${GATEWAY_TRUSTED_IP:}
