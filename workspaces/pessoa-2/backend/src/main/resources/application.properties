spring.application.name=pessoa2-backend
server.port=${P2_BACKEND_PORT:8082}
spring.datasource.url=${P2_DATABASE_URL:jdbc:postgresql://localhost:55432/pessoa2_db}
spring.datasource.username=${P2_DATABASE_USERNAME:pessoa2_user}
spring.datasource.password=${P2_DATABASE_PASSWORD:pessoa2_local_only}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
