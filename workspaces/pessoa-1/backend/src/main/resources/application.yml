spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/logistics}
    username: ${DB_USER:logistics}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration/identity,classpath:db/migration/orders,classpath:db/migration/billing,classpath:db/migration/routing
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  forward-headers-strategy: none
  port: 8080
app:
  security:
    login-trusted-proxy-ips: ${LOGIN_TRUSTED_PROXY_IPS:}
  jwt-secret: ${JWT_SECRET}
  demo-password: ${DEMO_PASSWORD}
