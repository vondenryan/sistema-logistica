name: Testes do repositório

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  ci-global:
    name: CI Global
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres-p2:
        image: postgres:16
        env:
          POSTGRES_DB: pessoa2_db
          POSTGRES_USER: pessoa2_user
          POSTGRES_PASSWORD: pessoa2_local_only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U pessoa2_user -d pessoa2_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Rodar suítes dos workspaces
        shell: bash
        env:
          MAVEN_OPTS: -DfailIfNoTests=true
        run: |
          shopt -s nullglob
          backends=(workspaces/*/backend/pom.xml)
          frontends=(workspaces/*/frontend/package.json)
          contracts=(workspaces/*/contract-tests/requirements.txt)

          if (( ${#backends[@]} + ${#frontends[@]} + ${#contracts[@]} == 0 )); then
            echo "::error::Nenhuma suíte foi encontrada em workspaces/."
            exit 1
          fi

          p1=workspaces/pessoa-1/backend/src
          p2=workspaces/pessoa-2/backend/src
          if [[ -f "$p1/main/java/contracts/v1/PartnerLookupPort.java" && -f "$p2/main/java/contracts/v1/PartnerLookupPort.java" ]]; then
            for type in AddressSnapshot ContractException OriginSnapshot OriginType PartnerLookupPort StoreSnapshot AssignmentRequest AssignmentSnapshot FleetAssignmentPort FleetReleasePort FleetType ReleaseReason ReleaseReceipt ReleaseRequest RouteSnapshot RouteSnapshotPort RouteStatus; do
              diff -u "$p1/main/java/contracts/v1/$type.java" "$p2/main/java/contracts/v1/$type.java"
            done
            diff -u "$p1/test/java/contracts/v1/PartnerLookupContract.java" "$p2/test/java/contracts/v1/PartnerLookupContract.java"
          fi

          for pom in "${backends[@]}"; do
            backend="${pom%/pom.xml}"
            echo "Testes Maven: $backend"
            if [[ -f "$backend/../scripts/test-backend.sh" ]]; then
              bash "$backend/../scripts/test-backend.sh"
            elif [[ -f "$backend/mvnw" ]]; then
              (cd "$backend" && bash ./mvnw --batch-mode -DfailIfNoTests=true test)
            else
              mvn --batch-mode --file "$pom" -DfailIfNoTests=true test
            fi
          done

          for manifest in "${frontends[@]}"; do
            frontend="${manifest%/package.json}"
            echo "Testes npm: $frontend"
            (cd "$frontend" && npm ci && npm test)
          done

          for requirements in "${contracts[@]}"; do
            suite="${requirements%/requirements.txt}"
            echo "Testes de contrato: $suite"
            tests=("$suite"/test*.py)
            if (( ${#tests[@]} == 0 )); then
              echo "::error::Nenhum arquivo test*.py em $suite."
              exit 1
            fi

            venv=$(mktemp -d "$RUNNER_TEMP/contracts.XXXXXXXX")
            python -m venv "$venv"
            "$venv/bin/python" -m pip install -r "$requirements"
            "$venv/bin/python" -m unittest discover -s "$suite" -v
          done

      - name: Validar integração de frota, entregas e rastreamento
        if: ${{ hashFiles('workspaces/pessoa-2/scripts/smoke-integration.py') != '' }}
        shell: bash
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres-p2.id }}
          DB_USER: pessoa2_user
          DB_PASSWORD: pessoa2_local_only
          SPRING_PROFILES_ACTIVE: integration-demo
          P2_SMOKE_URL: http://127.0.0.1:8080
          P3_SMOKE_MAILPIT_URL: http://127.0.0.1:8025
          MAIL_HOST: 127.0.0.1
          OSRM_BASE_URL: http://127.0.0.1:19090
          FREIGHT_TARIFF_PER_KM: '2.50'
          NOTIFICATIONS_OUTBOX_POLL_INTERVAL_MS: '1000'
        run: |
          p2=workspaces/pessoa-2
          p3=workspaces/pessoa-3
          mvn --batch-mode --file "$p2/backend/pom.xml" -Pintegration clean package -DskipTests
          export JWT_SECRET="$(openssl rand -hex 32)"
          export P2_SMOKE_PASSWORD="$(openssl rand -hex 16)"

          backend_pid=
          mailpit_id=
          log=
          stop_backend() {
            if [[ -n "$backend_pid" ]]; then
              kill "$backend_pid" 2>/dev/null || true
              wait "$backend_pid" 2>/dev/null || true
              backend_pid=
            fi
          }
          cleanup() {
            result=$?
            stop_backend
            if (( result != 0 )); then
              if [[ -n "$log" ]]; then cat "$log"; fi
              if [[ -n "$mailpit_id" ]]; then docker logs "$mailpit_id"; fi
            fi
            if [[ -n "$mailpit_id" ]]; then docker rm -f "$mailpit_id" >/dev/null; fi
          }
          trap cleanup EXIT

          start_backend() {
            local database="$1"
            docker exec "$POSTGRES_CONTAINER" createdb -U "$DB_USER" "$database"
            log="$RUNNER_TEMP/$database.log"
            DB_URL="jdbc:postgresql://127.0.0.1:55432/$database" \
              java -jar "$p2"/backend/target/*-integration.jar >"$log" 2>&1 &
            backend_pid=$!

            for attempt in {1..60}; do
              kill -0 "$backend_pid" || return 1
              if [[ "$(curl --silent --max-time 2 --output /dev/null --write-out '%{http_code}' \
                "$P2_SMOKE_URL/api/v1/auth/me")" == 401 ]] &&
                [[ "$(docker exec "$POSTGRES_CONTAINER" psql -U "$DB_USER" -d "$database" -Atqc \
                  "SELECT EXISTS (SELECT 1 FROM pessoa2.origins) AND EXISTS (SELECT 1 FROM pessoa2.vehicles)")" == t ]]; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          seed() {
            docker exec -e P2_SMOKE_PASSWORD -i "$POSTGRES_CONTAINER" \
              psql -U "$DB_USER" -d "$1" <"$2"
          }

          start_backend logistics_p2_ci
          seed logistics_p2_ci "$p2/scripts/seed-integration-actors.sql"
          python3 "$p2/scripts/smoke-integration.py"
          stop_backend

          if [[ -f "$p3/scripts/smoke-integration.py" ]]; then
            if ! command -v pdftotext >/dev/null; then
              sudo apt-get update
              sudo apt-get install -y poppler-utils
            fi
            mailpit_id="$(docker run -d -p 127.0.0.1:1025:1025 -p 127.0.0.1:8025:8025 \
              axllent/mailpit@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e)"
            start_backend logistics_p3_ci
            seed logistics_p3_ci "$p2/scripts/seed-integration-actors.sql"
            seed logistics_p3_ci "$p3/scripts/seed-smoke-drivers.sql"
            python3 "$p3/scripts/smoke-integration.py"
            npm --prefix "$p3/frontend" run build
            npm --prefix "$p3/frontend" run build:integration
          fi
