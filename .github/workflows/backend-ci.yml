name: Testes do repositório

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  ci-global:
    name: CI Global
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres-p2:
        image: postgres:16
        env:
          POSTGRES_DB: pessoa2_db
          POSTGRES_USER: pessoa2_user
          POSTGRES_PASSWORD: pessoa2_local_only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U pessoa2_user -d pessoa2_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Rodar suítes dos workspaces
        shell: bash
        env:
          MAVEN_OPTS: -DfailIfNoTests=true
        run: |
          shopt -s nullglob
          backends=(workspaces/*/backend/pom.xml)
          frontends=(workspaces/*/frontend/package.json)
          contracts=(workspaces/*/contract-tests/requirements.txt)

          if (( ${#backends[@]} + ${#frontends[@]} + ${#contracts[@]} == 0 )); then
            echo "::error::Nenhuma suíte foi encontrada em workspaces/."
            exit 1
          fi

          p1=workspaces/pessoa-1/backend/src
          p2=workspaces/pessoa-2/backend/src
          if [[ -f "$p1/main/java/contracts/v1/PartnerLookupPort.java" && -f "$p2/main/java/contracts/v1/PartnerLookupPort.java" ]]; then
            for type in AddressSnapshot ContractException OriginSnapshot OriginType PartnerLookupPort StoreSnapshot AssignmentRequest AssignmentSnapshot FleetAssignmentPort FleetReleasePort FleetType ReleaseReason ReleaseReceipt ReleaseRequest RouteSnapshot RouteSnapshotPort RouteStatus; do
              diff -u "$p1/main/java/contracts/v1/$type.java" "$p2/main/java/contracts/v1/$type.java"
            done
            diff -u "$p1/test/java/contracts/v1/PartnerLookupContract.java" "$p2/test/java/contracts/v1/PartnerLookupContract.java"
          fi

          for pom in "${backends[@]}"; do
            backend="${pom%/pom.xml}"
            echo "Testes Maven: $backend"
            if [[ -f "$backend/../scripts/test-backend.sh" ]]; then
              bash "$backend/../scripts/test-backend.sh"
            elif [[ -f "$backend/mvnw" ]]; then
              (cd "$backend" && bash ./mvnw --batch-mode -DfailIfNoTests=true test)
            else
              mvn --batch-mode --file "$pom" -DfailIfNoTests=true test
            fi
          done

          for manifest in "${frontends[@]}"; do
            frontend="${manifest%/package.json}"
            echo "Testes npm: $frontend"
            (cd "$frontend" && npm ci && npm test)
          done

          for requirements in "${contracts[@]}"; do
            suite="${requirements%/requirements.txt}"
            echo "Testes de contrato: $suite"
            tests=("$suite"/test*.py)
            if (( ${#tests[@]} == 0 )); then
              echo "::error::Nenhum arquivo test*.py em $suite."
              exit 1
            fi

            venv=$(mktemp -d "$RUNNER_TEMP/contracts.XXXXXXXX")
            python -m venv "$venv"
            "$venv/bin/python" -m pip install -r "$requirements"
            "$venv/bin/python" -m unittest discover -s "$suite" -v
          done
