name: Testes do repositório

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  ci-global:
    name: CI Global
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres-p2:
        image: postgres:16
        env:
          POSTGRES_DB: pessoa2_db
          POSTGRES_USER: pessoa2_user
          POSTGRES_PASSWORD: pessoa2_local_only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U pessoa2_user -d pessoa2_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Rodar suítes dos workspaces
        shell: bash
        env:
          MAVEN_OPTS: -DfailIfNoTests=true
        run: |
          shopt -s nullglob
          backends=(workspaces/*/backend/pom.xml)
          frontends=(workspaces/*/frontend/package.json)
          contracts=(workspaces/*/contract-tests/requirements.txt)

          if (( ${#backends[@]} + ${#frontends[@]} + ${#contracts[@]} == 0 )); then
            echo "::error::Nenhuma suíte foi encontrada em workspaces/."
            exit 1
          fi

          p1=workspaces/pessoa-1/backend/src
          p2=workspaces/pessoa-2/backend/src
          if [[ -f "$p1/main/java/contracts/v1/PartnerLookupPort.java" && -f "$p2/main/java/contracts/v1/PartnerLookupPort.java" ]]; then
            for type in AddressSnapshot ContractException OriginSnapshot OriginType PartnerLookupPort StoreSnapshot AssignmentRequest AssignmentSnapshot FleetAssignmentPort FleetReleasePort FleetType ReleaseReason ReleaseReceipt ReleaseRequest RouteSnapshot RouteSnapshotPort RouteStatus; do
              diff -u "$p1/main/java/contracts/v1/$type.java" "$p2/main/java/contracts/v1/$type.java"
            done
            diff -u "$p1/test/java/contracts/v1/PartnerLookupContract.java" "$p2/test/java/contracts/v1/PartnerLookupContract.java"
          fi

          for pom in "${backends[@]}"; do
            backend="${pom%/pom.xml}"
            echo "Testes Maven: $backend"
            if [[ -f "$backend/../scripts/test-backend.sh" ]]; then
              bash "$backend/../scripts/test-backend.sh"
            elif [[ -f "$backend/mvnw" ]]; then
              (cd "$backend" && bash ./mvnw --batch-mode -DfailIfNoTests=true test)
            else
              mvn --batch-mode --file "$pom" -DfailIfNoTests=true test
            fi
          done

          for manifest in "${frontends[@]}"; do
            frontend="${manifest%/package.json}"
            echo "Testes npm: $frontend"
            (cd "$frontend" && npm ci && npm test)
          done

          for requirements in "${contracts[@]}"; do
            suite="${requirements%/requirements.txt}"
            echo "Testes de contrato: $suite"
            tests=("$suite"/test*.py)
            if (( ${#tests[@]} == 0 )); then
              echo "::error::Nenhum arquivo test*.py em $suite."
              exit 1
            fi

            venv=$(mktemp -d "$RUNNER_TEMP/contracts.XXXXXXXX")
            python -m venv "$venv"
            "$venv/bin/python" -m pip install -r "$requirements"
            "$venv/bin/python" -m unittest discover -s "$suite" -v
          done

      - name: Validar backend integrado e rastreamento público
        if: ${{ hashFiles('workspaces/pessoa-2/scripts/smoke-integration.py') != '' }}
        shell: bash
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres-p2.id }}
          DB_URL: jdbc:postgresql://127.0.0.1:55432/logistics_integration_ci
          DB_USER: pessoa2_user
          DB_PASSWORD: pessoa2_local_only
          SPRING_PROFILES_ACTIVE: integration-demo
          P2_SMOKE_URL: http://127.0.0.1:8080
        run: |
          workspace=workspaces/pessoa-2
          mvn --batch-mode --file "$workspace/backend/pom.xml" -Pintegration clean package -DskipTests
          docker exec "$POSTGRES_CONTAINER" createdb -U "$DB_USER" logistics_integration_ci
          export JWT_SECRET="$(openssl rand -hex 32)"
          export P2_SMOKE_PASSWORD="$(openssl rand -hex 16)"

          log="$RUNNER_TEMP/logistics-integration.log"
          java -jar "$workspace"/backend/target/*-integration.jar >"$log" 2>&1 &
          backend_pid=$!
          cleanup() {
            result=$?
            kill "$backend_pid" 2>/dev/null || true
            if (( result != 0 )); then cat "$log"; fi
          }
          trap cleanup EXIT

          ready=false
          for attempt in {1..60}; do
            kill -0 "$backend_pid"
            if [[ "$(curl --silent --max-time 2 --output /dev/null --write-out '%{http_code}' \
              "$P2_SMOKE_URL/api/v1/auth/me")" == 401 ]] &&
              [[ "$(docker exec "$POSTGRES_CONTAINER" psql -U "$DB_USER" -d logistics_integration_ci -Atqc \
                "SELECT EXISTS (SELECT 1 FROM pessoa2.origins) AND EXISTS (SELECT 1 FROM pessoa2.vehicles)")" == t ]]; then
              ready=true
              break
            fi
            sleep 1
          done
          [[ "$ready" == true ]]
          docker exec -e P2_SMOKE_PASSWORD -i "$POSTGRES_CONTAINER" \
            psql -U "$DB_USER" -d logistics_integration_ci <"$workspace/scripts/seed-integration-actors.sql"
          python3 "$workspace/scripts/smoke-integration.py"
